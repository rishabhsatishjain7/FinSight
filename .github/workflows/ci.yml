name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          # Must match PG_TEST_URL in tests/test_storage.py exactly:
          #   postgresql+psycopg2://postgres:finsight_test@localhost:5432/finsight_test
          # so the 4 Postgres-specific tests RUN in CI instead of skipping.
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: finsight_test
          POSTGRES_DB: finsight_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v
